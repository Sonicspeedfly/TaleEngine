[pytest]
# asyncio_mode = auto -> можно писать async-тесты без декоратора @pytest.mark.asyncio.
asyncio_mode = auto
# pythonpath = . -> чтобы `import backend...` работал при запуске из корня проекта.
pythonpath = .
testpaths = tests
markers =
    low_disk: тест проверяет поведение prestart при нехватке места
