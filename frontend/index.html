<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: экранная клавиатура СЖИМАЕТ страницу,
         а не наезжает на неё. По умолчанию Chrome на Android только сдвигает
         видимую область к полю ввода, и кнопка «Отправить», стоящая на телефоне
         строкой ниже поля, оставалась под клавиатурой. iOS атрибут пока не
         читает — там композер держат 100dvh и потолки стопки полос в CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#12141a" />
    <title>TaleEngine</title>

    <!-- Ранний коннект к CDN: на мобильном DNS + TLS до чужого хоста стоит сотни
         миллисекунд, и начинать их в момент разбора <script> уже поздно. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <link rel="stylesheet" href="/styles.css" />

    <!-- Без сборки: библиотеки подключаются с CDN.

         defer — важнее всего остального: без него браузер останавливает разбор
         страницы на КАЖДОМ скрипте и не рисует ничего, пока все не скачаются.
         С defer они качаются параллельно, а выполняются по порядку перед
         DOMContentLoaded — Vue гарантированно раньше app.js.

         Все три — с ОДНОГО хоста (было два: unpkg + jsdelivr): лишний DNS + TLS
         на мобильном стоит дороже, чем кажется. -->
    <script defer src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <!-- Хроника Horae: компоненты, которые app.js регистрирует при старте, —
         поэтому строго раньше него (defer сохраняет порядок). -->
    <script defer src="/horae.js"></script>
    <script defer src="/app.js"></script>

    <!-- KaTeX (формулы) и lamejs (кодирование голоса в MP3) здесь НЕ подключены
         намеренно: вдвоём они тяжелее всего остального вместе взятого, а нужны
         редко — только если в ответе встретилась формула или нажата запись
         голоса. Их подтягивает app.js по факту надобности (ensureKatex /
         ensureLame), поэтому обычный чат за них больше не платит. -->
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
